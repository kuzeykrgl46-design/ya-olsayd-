<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ya Olsaydı #1 Bölüm 2</title>
<style>
  :root { --bg:#0b1620; --fg:#f2f2f2; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Inter, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  canvas { height:min(86vh, calc(100vw * 16 / 9)); aspect-ratio:9/16; border-radius:12px; box-shadow:0 10px 40px #0008; }
  .ctrl { display:flex; gap:10px; align-items:center; width:min(90vw,480px); }
  .ctrl input { flex:1; }
  button { background:#1d6fa5; color:#fff; border:0; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; }
  body.render { display:block; }
  body.render canvas { height:auto; width:1080px; border-radius:0; box-shadow:none; }
  body.render .ctrl { display:none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="ctrl">
  <button id="play">▶ Oynat</button>
  <input id="seek" type="range" min="0" max="41.5" step="0.01" value="0">
  <span id="tm">0.0s</span>
</div>
<script>
const W = 1080, H = 1920, DUR = 41.5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const COS = Math.cos(39 * Math.PI / 180);
const K = 66;
const MAPY = 840;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const backOut = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
// in/out visibility envelope
function vis(t, a, b, fi = .35, fo = .35) { return clamp((t - a) / fi) * clamp((b - t) / fo); }

// ---------- geography (lon, lat) ----------
const borderWest = [[26.04,40.73],[26.32,41.05],[26.36,41.35],[26.62,41.6],[26.35,41.72],[26.6,41.95],[27.3,42.1],[27.8,41.98],[28.02,41.98]];
const thraceBlack = [[28.3,41.6],[28.75,41.35],[29.1,41.24]];
const thraceMarmara = [[29.02,41.03],[28.6,40.98],[28.0,41.0],[27.5,40.97],[27.2,40.65],[26.75,40.42],[26.4,40.12],[26.18,40.05],[26.22,40.32],[26.65,40.58],[26.3,40.62]];
const anaBlack = [[29.15,41.22],[29.9,41.15],[30.6,41.15],[31.4,41.3],[32.3,41.75],[33.3,42.0],[34.2,41.97],[34.9,42.05],[35.15,42.02],[35.3,41.7],[36.1,41.65],[36.4,41.25],[37.1,41.15],[38.0,40.98],[38.9,41.03],[39.8,41.0],[40.4,40.98],[41.0,41.2]];
const borderEast = [[41.55,41.52],[42.2,41.5],[42.8,41.58],[43.45,41.12],[43.7,40.98],[43.6,40.5],[43.75,40.15],[44.35,40.03],[44.78,39.71],[44.6,39.5],[44.1,39.35],[44.25,38.95],[44.3,38.4],[44.45,38.0],[44.25,37.85],[44.6,37.6],[44.79,37.15]];
const borderSouth = [[44.3,37.05],[43.9,37.25],[43.3,37.32],[42.75,37.35],[42.36,37.11],[41.4,37.07],[40.0,36.83],[38.95,36.7],[38.0,36.84],[37.1,36.65],[36.67,36.83],[36.6,36.45],[36.68,36.23],[36.38,36.0],[36.15,35.82],[35.92,35.9]];
const medCoast = [[35.97,36.2],[35.85,36.45],[36.17,36.6],[36.0,36.92],[35.6,36.6],[35.0,36.65],[34.6,36.78],[34.05,36.35],[33.6,36.15],[32.85,36.03],[32.3,36.25],[31.75,36.6],[31.0,36.85],[30.6,36.85],[30.55,36.45],[30.35,36.25],[29.7,36.15],[29.1,36.6],[28.6,36.75],[28.05,36.6],[27.6,36.75],[27.45,37.05],[27.25,37.35],[27.25,37.95],[26.75,38.2],[26.3,38.25],[26.5,38.45],[26.9,38.45],[26.75,38.75],[26.9,39.1],[26.65,39.3],[26.1,39.45],[26.15,39.95]];
const marmaraS = [[26.38,40.12],[26.7,40.38],[27.3,40.42],[27.8,40.35],[28.4,40.4],[29.0,40.38],[29.9,40.72],[29.4,40.82],[29.05,41.0]];

const thrace = [...borderWest, ...thraceBlack, ...thraceMarmara];
const anatolia = [...anaBlack, ...borderEast, ...borderSouth, ...medCoast, ...marmaraS];

const chunks = [
  { pts: [...borderWest.slice().reverse(), [25.95,40.8],[25.5,40.85],[24.5,40.95],[21,40.9],[21,44.5],[28.4,44.5],[27.9,43.2],[27.7,42.7],[27.95,42.4]], d: [-5, 1.2] },
  { pts: [...borderEast, [48,37.15],[48,45],[39.5,45],[41.0,43.0],[41.65,42.15],[41.6,41.65]], d: [5, 2.2] },
  { pts: [[44.79,37.15], ...borderSouth, [35.85,35.5],[35.9,34.5],[35.6,32],[48,32],[48,37.15]], d: [1.5, -4.5] },
];
const cyprus = [[32.3,35.05],[32.9,35.4],[33.6,35.35],[34.6,35.7],[34.0,35.2],[33.9,34.95],[33.0,34.6],[32.4,34.75]];
const borderSegs = [borderWest, borderEast, [[44.79,37.15], ...borderSouth]];
const vanLake = (() => { const p = []; for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2; const x = Math.cos(a) * .62, y = Math.sin(a) * .3; const r = -.45; p.push([42.95 + x * Math.cos(r) - y * Math.sin(r), 38.65 + x * Math.sin(r) + y * Math.cos(r) + (a > 3.6 && a < 5 ? .12 : 0)]); } return p; })();

const CITY = {
  edirne: [26.56,41.68], kars: [43.1,40.6], urfa: [38.79,37.16], van: [43.38,38.5], ankara: [32.86,39.93]
};
const NEW12 = [['Edirne',26.56,41.68],['Ardahan',42.7,41.11],['Kars',43.1,40.6],['Iğdır',44.04,39.92],['Ağrı',43.05,39.72],['Van',43.38,38.5],['Hakkari',43.74,37.58],['Şırnak',42.46,37.52],['Mardin',40.74,37.31],['Şanlıurfa',38.79,37.16],['Gaziantep',37.38,37.07],['Kilis',37.12,36.72]];

// ---------- camera ----------
const FULL = { lon: 35.35, lat: 39.0, z: 1.0 };
const URFA = { lon: 39.15, lat: 37.0, z: 3.0 }, BORDER = { lon: 43.9, lat: 39.75, z: 3.0 }, EDIRNE = { lon: 26.75, lat: 41.45, z: 3.2 }, ANK = { lon: 33.1, lat: 39.75, z: 2.4 };
const zz = (c, k) => ({ ...c, z: c.z * k });
const KEYS = [
  [0, FULL], [4.6, zz(FULL, 1.04)], [7.0, FULL], [7.9, URFA], [13.0, zz(URFA, 1.06)],
  [13.6, BORDER], [17.4, zz(BORDER, 1.06)], [18.0, BORDER], [18.7, EDIRNE], [22.3, zz(EDIRNE, 1.06)],
  [31.6, FULL], [35.1, FULL], [36.0, ANK], [41.5, zz(ANK, 1.06)],
];
function camera(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [t0, a] = KEYS[i], [t1, b] = KEYS[i + 1];
    if (t <= t1) {
      const p = ease(prog(t, t0, t1));
      // zoom interpolated in log space for smooth feel
      return { lon: lerp(a.lon, b.lon, p), lat: lerp(a.lat, b.lat, p), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), p)) };
    }
  }
  return KEYS[KEYS.length - 1][1];
}
let cam = FULL;
function P(lon, lat) { const s = K * cam.z; return [W / 2 + (lon - cam.lon) * COS * s, MAPY - (lat - cam.lat) * s]; }
function path(pts, off = [0, 0]) {
  ctx.beginPath();
  pts.forEach(([lo, la], i) => { const [x, y] = P(lo + off[0], la + off[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
}
function polyline(pts) {
  ctx.beginPath();
  pts.forEach(([lo, la], i) => { const [x, y] = P(lo, la); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
}

// ---------- drawing primitives ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(w, s) { ctx.font = `${w} ${s}px Inter`; }
function wrap(text, maxW) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
function pill(text, x, y, { size = 30, bg = '#111c', fg = '#fff', weight = 800, alpha = 1, pad = 16 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; font(weight, size);
  const w = ctx.measureText(text).width + pad * 2, h = size * 1.55;
  rr(x - w / 2, y - h / 2, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 1);
  ctx.restore();
}

// ---------- background & map ----------
function drawSea(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a2a44'); g.addColorStop(.45, '#13507a'); g.addColorStop(1, '#0a2a44');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.strokeStyle = '#ffffff10'; ctx.lineWidth = 2;
  for (let r = 0; r < 26; r++) {
    const y0 = r * 76 + 20; ctx.beginPath();
    for (let x = 0; x <= W; x += 20) { const y = y0 + Math.sin(x * .012 + t * 1.6 + r) * 7; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
}

function jagged(seg, seed) {
  const out = [];
  for (let i = 0; i < seg.length - 1; i++) {
    const [a, b] = [seg[i], seg[i + 1]];
    for (let k = 0; k < 4; k++) {
      const p = k / 4, n = (rnd(seed + i * 7 + k) - .5) * .09;
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
      out.push([lerp(a[0], b[0], p) - dy / L * n, lerp(a[1], b[1], p) + dx / L * n]);
    }
  }
  out.push(seg[seg.length - 1]); return out;
}
const cracks = borderSegs.map((s, i) => jagged(s, i * 100));

function drawMap(t, { island }) {
  const s = K * cam.z;
  // neighbours
  const drift = island ? ease(prog(t, 2.0, 4.0)) : 0;
  chunks.forEach(c => {
    const a = 1 - drift;
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    path(c.pts, [c.d[0] * drift, c.d[1] * drift]);
    ctx.fillStyle = '#5d6b62'; ctx.fill();
    ctx.restore();
  });
  // cyprus (a real island, stays)
  path(cyprus); ctx.fillStyle = '#5d6b62'; ctx.fill();

  // foam around Turkey (coast) — grows along former borders as island forms
  ctx.save(); ctx.lineJoin = 'round';
  [thrace, anatolia].forEach(p => { path(p); ctx.strokeStyle = '#bfe9ff55'; ctx.lineWidth = Math.max(4, 5 * cam.z); ctx.stroke(); });
  ctx.restore();

  // land
  const lg = ctx.createLinearGradient(0, MAPY - 4 * s, 0, MAPY + 4 * s);
  lg.addColorStop(0, '#f1dfaa'); lg.addColorStop(1, '#d9bf80');
  [thrace, anatolia].forEach(p => {
    path(p); ctx.fillStyle = lg; ctx.fill();
    ctx.strokeStyle = '#9c7f45'; ctx.lineWidth = Math.max(1.5, 1.2 * cam.z); ctx.lineJoin = 'round'; ctx.stroke();
  });
  // lake van
  path(vanLake); ctx.fillStyle = '#1d6fa5'; ctx.fill();

  // land borders → cracks → coast
  if (island) {
    const cp = prog(t, .9, 2.2);
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    cracks.forEach((cr, i) => {
      const n = Math.max(2, Math.floor(cr.length * cp));
      if (cp <= 0) return;
      polyline(cr.slice(0, n));
      ctx.strokeStyle = `rgba(255,255,255,${.9 * (1 - drift)})`; ctx.lineWidth = 4 + 3 * Math.sin(t * 30 + i);
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 18; ctx.stroke();
    });
    ctx.restore();
    if (drift > .2) {
      ctx.save(); ctx.globalAlpha = clamp((drift - .2) / .5); ctx.lineJoin = 'round';
      borderSegs.forEach(sg => { polyline(sg); ctx.strokeStyle = '#e6f7ff'; ctx.lineWidth = Math.max(3, 3 * cam.z); ctx.stroke(); });
      ctx.restore();
    }
  } else {
    ctx.save(); ctx.setLineDash([8, 8]);
    borderSegs.forEach(sg => { polyline(sg); ctx.strokeStyle = '#6b5530'; ctx.lineWidth = 2; ctx.stroke(); });
    ctx.restore();
  }
}

function cityDot(name, ll, alpha = 1, color = '#e63946') {
  if (alpha <= 0) return;
  const [x, y] = P(...ll);
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.restore();
  pill(name, x, y - 44, { size: 30, alpha });
}

// ---------- props ----------
function ferry(x, y, sc, t) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 3) * 4); ctx.rotate(Math.sin(t * 2.2) * .03); ctx.scale(sc, sc);
  // wake
  ctx.fillStyle = '#ffffff55';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(70 + i * 26, 22, 14 - i * 2, 5, 0, 0, 7); ctx.fill(); }
  // hull
  ctx.beginPath(); ctx.moveTo(-80, 0); ctx.lineTo(80, 0); ctx.lineTo(62, 26); ctx.lineTo(-66, 26); ctx.closePath();
  ctx.fillStyle = '#f4f4f4'; ctx.fill();
  ctx.fillStyle = '#c62828'; ctx.fillRect(-72, 12, 146, 7);
  // cabin
  rr(-50, -30, 96, 30, 6); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#1d3557'; for (let i = 0; i < 5; i++) { rr(-42 + i * 18, -22, 12, 12, 3); ctx.fill(); }
  // funnel + smoke
  ctx.fillStyle = '#c62828'; ctx.fillRect(14, -52, 16, 22);
  for (let i = 0; i < 3; i++) {
    const p = (t * .7 + i / 3) % 1; ctx.globalAlpha = .6 * (1 - p);
    ctx.beginPath(); ctx.arc(22 + p * 40, -60 - p * 50, 8 + p * 14, 0, 7); ctx.fillStyle = '#dfe6ea'; ctx.fill();
  }
  ctx.restore();
}

function car(x, y, sc, hue) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  // luggage
  ctx.fillStyle = '#8d6e63'; rr(-30, -58, 34, 16, 3); ctx.fill();
  ctx.fillStyle = '#5d4037'; rr(6, -54, 24, 12, 3); ctx.fill();
  ctx.fillStyle = '#3949ab'; rr(-18, -70, 30, 13, 3); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-36, -42); ctx.lineTo(36, -42); ctx.stroke();
  // body
  ctx.fillStyle = `hsl(${hue},55%,45%)`;
  rr(-48, -20, 96, 26, 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, -20); ctx.lineTo(-20, -42); ctx.lineTo(24, -42); ctx.lineTo(36, -20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#bfe3f5'; ctx.beginPath(); ctx.moveTo(-24, -22); ctx.lineTo(-17, -38); ctx.lineTo(0, -38); ctx.lineTo(0, -22); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4, -22); ctx.lineTo(4, -38); ctx.lineTo(21, -38); ctx.lineTo(30, -22); ctx.closePath(); ctx.fill();
  // plate
  ctx.fillStyle = '#fff'; rr(-14, -6, 28, 10, 2); ctx.fill();
  ctx.fillStyle = '#1e40af'; ctx.fillRect(-14, -6, 5, 10);
  // wheels
  ctx.fillStyle = '#1b1b1b'; [-28, 28].forEach(wx => { ctx.beginPath(); ctx.arc(wx, 8, 11, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#9e9e9e'; [-28, 28].forEach(wx => { ctx.beginPath(); ctx.arc(wx, 8, 4, 0, 7); ctx.fill(); });
  ctx.restore();
}

function umbrella(x, y, sc, snowy) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, -70); ctx.lineTo(4, 40); ctx.stroke();
  const cols = ['#e63946', '#fff'];
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, -72); ctx.arc(0, -72, 70, Math.PI + i * Math.PI / 6, Math.PI + (i + 1) * Math.PI / 6); ctx.closePath(); ctx.fillStyle = cols[i % 2]; ctx.fill(); }
  if (snowy) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, -128, 46, 14, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(-40, -100, 22, 9, -.7, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(40, -100, 22, 9, .7, 0, 7); ctx.fill(); }
  ctx.restore();
}

function lounger(x, y, sc, coat) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-60, 20); ctx.lineTo(30, 20); ctx.lineTo(60, -20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-50, 20); ctx.lineTo(-50, 38); ctx.moveTo(20, 20); ctx.lineTo(20, 38); ctx.stroke();
  // person
  ctx.fillStyle = coat ? '#2a4d8f' : '#f4a261';
  rr(-50, -2, 80, 22, 10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(26, 2); ctx.lineTo(52, -26); ctx.lineTo(60, -14); ctx.lineTo(36, 14); ctx.fill();
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(60, -34, 14, 0, 7); ctx.fill();
  if (coat) {
    ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.arc(60, -38, 14, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.arc(60, -54, 6, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.fillStyle = '#e9c46a'; ctx.fillRect(44, -24, 30, 7); // scarf
  } else {
    ctx.fillStyle = '#111'; ctx.fillRect(50, -38, 22, 6); // sunglasses
  }
  ctx.restore();
}

function thermometer(x, y, value, hot, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
  rr(-26, -170, 52, 230, 26); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 70, 42, 0, 7); ctx.fill();
  const col = hot ? '#e63946' : '#4cc9f0';
  const lvl = hot ? 0.95 : 0.12;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 70, 32, 0, 7); ctx.fill();
  rr(-12, 40 - 200 * lvl, 24, 200 * lvl + 10, 12); ctx.fill();
  ctx.strokeStyle = '#9993'; ctx.lineWidth = 3;
  for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(14, 30 - i * 24); ctx.lineTo(24, 30 - i * 24); ctx.stroke(); }
  ctx.restore();
  pill(value, x, y + 150, { size: 52, bg: hot ? '#e63946' : '#1f7fbf', alpha });
}

function vanMan(x, y, sc, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  // legs
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(-22, 40, 18, 70); ctx.fillRect(4, 40, 18, 70);
  ctx.fillStyle = '#111'; rr(-26, 104, 24, 12, 4); ctx.fill(); rr(2, 104, 24, 12, 4); ctx.fill();
  // body (vest)
  ctx.fillStyle = '#5b4636'; rr(-36, -40, 72, 90, 18); ctx.fill();
  // crossed arms
  ctx.fillStyle = '#4a382b'; rr(-42, -4, 84, 24, 12); ctx.fill();
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(-40, 8, 9, 0, 7); ctx.arc(40, 8, 9, 0, 7); ctx.fill();
  // head
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(0, -66, 28, 0, 7); ctx.fill();
  // cap (kasket)
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(0, -86, 32, 14, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(-32, -88, 64, 6); ctx.beginPath(); ctx.ellipse(14, -82, 22, 6, 0, 0, 7); ctx.fill();
  // eyes: unimpressed, half-closed
  ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-14, -70); ctx.lineTo(-4, -70); ctx.moveTo(4, -70); ctx.lineTo(14, -70); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-15, -77); ctx.lineTo(-4, -79); ctx.moveTo(4, -79); ctx.lineTo(15, -77); ctx.stroke();
  // mustache
  ctx.fillStyle = '#2b1d14'; ctx.beginPath(); ctx.ellipse(-8, -55, 11, 5, .2, 0, 7); ctx.ellipse(8, -55, 11, 5, -.2, 0, 7); ctx.fill();
  ctx.restore();
}

function speech(x, y, text, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; font(800, 40);
  const lines = wrap(text, 440); const w = 500, h = lines.length * 52 + 44;
  const sc = backOut(clamp(alpha * 1.2)); ctx.translate(x, y); ctx.scale(sc, sc);
  rr(-w / 2, -h, w, h, 28); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-60, -2); ctx.lineTo(-110, 50); ctx.lineTo(-20, -2); ctx.fill();

function title(lines, a, b, t, y = 330) {
  const v = vis(t, a, b, .4, .35); if (v <= 0) return;
  const sc = lerp(.85, 1, backOut(clamp((t - a) / .45)));
  ctx.save(); ctx.globalAlpha = v; ctx.translate(W / 2, y); ctx.scale(sc, sc);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const hs = lines.map(l => l[1] * 1.08), total = hs.reduce((a, b) => a + b, 0);

  lines.forEach(([txt, size, color], i) => {

    ctx.lineWidth = size * .16; ctx.strokeStyle = '#000a'; ctx.lineJoin = 'round'; ctx.strokeText(txt, 0, yy);
    ctx.fillStyle = color; ctx.fillText(txt, 0, yy);
  });
  ctx.restore();
}

// ---------- scene ----------
function render(t) {
  cam = camera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawSea(t);
  const bridgeScene = t > 27.7 && t < 31.75;
  if (!bridgeScene) drawMap(10, { island: true });

  // ---- 1: recap ----
  if (t < 4.7) {
    const v = vis(t, 0.2, 4.6, .3, .3);
    cityDot('Ankara', CITY.ankara, v);
    if (v > 0) { const [ax, ay] = P(...CITY.ankara); ctx.save(); ctx.globalAlpha = v; binocularMan(ax + 150, ay + 150, .8); sadFace(ax - 120, ay - 30, 34, t); ctx.restore(); }
    title([['GEÇEN BÖLÜMDE...', 70, '#fff'], ['TÜRKİYE ADA OLDU', 62, '#ffd166']], 0.2, 4.5, t, 360);
  }
  // ---- 2: question ----
  title([['İYİ Mİ OLDU,', 84, '#06d6a0'], ['KÖTÜ MÜ?', 96, '#e63946']], 4.8, 7.6, t, 360);

  // ---- 3: Urfa cooked fish ----
  if (t > 7.6 && t < 13.4) {
    const v = vis(t, 7.8, 13.25, .4, .3);
    ctx.save(); ctx.globalAlpha = v;
    ctx.fillStyle = 'rgba(255,120,40,0.14)'; ctx.fillRect(0, 0, W, H);
    cityDot('Şanlıurfa', CITY.urfa, 1);
    for (let i = 0; i < 7; i++) { const [sx, sy] = P(38.3 + i * .3, 36.45); steam(sx, sy, t + i * .3, 2, 90, .55); }
    const [fx, fy] = P(39.35, 36.62);
    person(fx - 120, fy - 60, 1.1, { shirt: '#e76f51', hat: '#264653' });
    // rod + line
    const reel = clamp((t - 10.6) / 1.0);
    const fishY = lerp(fy + 160, fy - 40, easeOut(reel));
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(fx - 90, fy - 90); ctx.lineTo(fx + 60, fy - 220); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(fx + 60, fy - 220); ctx.lineTo(fx + 70, fishY - 30); ctx.stroke();
    if (t > 10.5) { cookedFish(fx + 70, fishY, .7, Math.PI / 2 * .9, false); steam(fx + 70, fishY - 60, t, 3, 60, .8); }
    if (t > 11.8) {
      const pv = backOut(clamp((t - 11.8) / .4));
      cookedFish(W / 2, 1150, 1.1 * pv, 0, true); steam(W / 2, 1110, t, 3, 80, .8);
      pill('PİŞMİŞ!', W / 2, 1240, { size: 34, bg: '#e63946', alpha: clamp((t - 12) / .3) });
    }
    ctx.restore();
    title([['URFA: TERMAL PLAJ', 66, '#ffb703']], 8.0, 13.2, t, 340);
  }

  // ---- 4: border post -> kiosk ----
  if (t > 13.2 && t < 17.5) {
    const v = vis(t, 13.4, 17.4, .4, .2);
    ctx.save(); ctx.globalAlpha = v;
    const [kx, ky] = P(44.35, 39.95);
    kiosk(kx - 60, ky + 40, 1.3 * backOut(clamp((t - 14.6) / .45)) + .0001);
    person(kx - 280, ky + 120, .9, { shirt: '#f4a261' });
    person(kx - 360, ky + 130, .85, { shirt: '#3a86ff' });
    ctx.restore();
    title([['KARA SINIRI: 0 KM', 70, '#06d6a0']], 13.5, 17.35, t, 340);
  }

  // ---- AMA ----
  if (t > 17.4 && t < 18.4) {
    const v = vis(t, 17.45, 18.35, .08, .15);
    ctx.save(); ctx.globalAlpha = v * .7; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();
    title([['AMA...', 150, '#fff']], 17.45, 18.35, t, 860);
  }

  // ---- 5: Kapıkule trucks ----
  if (t > 18.2 && t < 22.5) {
    const v = vis(t, 18.35, 22.35, .3, .25);
    ctx.save(); ctx.globalAlpha = v;
    const [ex, ey] = P(26.55, 41.67);
    pill('KAPIKULE', ex, ey - 60, { size: 30 });
    for (let i = 0; i < 6; i++) truck(ex + 40 + i * 170, ey + 140 + i * 18, .95, [10, 200, 130, 40, 280, 0][i]);
    // first driver at the shore, about to dive
    const up = t > 20.4;
    person(ex - 70, ey + 120, 1.0, { shirt: '#2a9d8f', armsUp: up });
    if (up) { font(900, 40); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('?!', ex - 70, ey + 10); }
    ctx.restore();
    title([['TIRLAR YOLDA KALDI', 66, '#e63946']], 18.4, 22.3, t, 340);
  }

  // ---- 6: gas pipes / mom & kombi (interior) ----
  if (t > 22.3 && t < 27.95) {
    const v = vis(t, 22.4, 27.85, .3, .25);
    ctx.save(); ctx.globalAlpha = v;
    const wall = ctx.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, '#f6e7cb'); wall.addColorStop(1, '#e9d5b0');
    ctx.fillStyle = wall; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#b08968'; ctx.fillRect(0, 1350, W, H - 1350);
    // broken pipe banner first
    if (t < 24.6) {
      const pv = vis(t, 22.5, 24.6, .25, .2);
      ctx.save(); ctx.globalAlpha *= pv;
      ctx.fillStyle = '#adb5bd'; rr(120, 820, 360, 50, 25); ctx.fill(); rr(600, 840, 360, 50, 25); ctx.fill();
      ctx.strokeStyle = '#e63946'; ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(505, 820); ctx.lineTo(575, 890); ctx.moveTo(575, 820); ctx.lineTo(505, 890); ctx.stroke();
      ctx.restore();
    }
    if (t > 24.0) {
      const on = t < 25.4;
      kombi(300, 900, 1.25, on);
      mom(720, 1080, 1.5, t > 26.4);
      // cold tint + shiver text once off
      if (!on) { ctx.save(); ctx.globalAlpha *= clamp((t - 25.4) / .6) * .18; ctx.fillStyle = '#4cc9f0'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
      if (t > 26.4) {
        const cols = ['#e76f51', '#2a9d8f', '#e9c46a', '#8338ec', '#ff006e'];
        for (let i = 0; i < 5; i++) {
          const p = clamp((t - 26.4 - i * .12) / .9); if (p <= 0) continue;
          const x = lerp(800, 120 + i * 190, easeOut(p)), y = lerp(950, 1250 - Math.sin(p * Math.PI) * 300 + i * 10, p);
          cardigan(x, y, .9, p * 4 + i, cols[i]);
        }
        speech(560, 640, 'Hırkanı giy!', vis(t, 26.6, 27.85, .2, .2));
      }
    }
    ctx.restore();
    title([['DOĞALGAZ HATLARI', 60, '#e63946'], ['KOPTU', 72, '#e63946']], 22.5, 25.2, t, 340);
  }

  // ---- 7: bridge -> ferry ----
  if (bridgeScene) {
    const v = vis(t, 27.85, 31.6, .3, .2);
    ctx.save(); ctx.globalAlpha = v;
    const saveCam = cam; cam = { lon: 35.4, lat: 39.0, z: .5 };
    [thrace, anatolia].forEach(p => { path(p); ctx.fillStyle = '#e8d6a0'; ctx.fill(); ctx.strokeStyle = '#e6f7ff'; ctx.lineWidth = 4; ctx.stroke(); });
    cam = saveCam;
    landBlock(-40, 720, 240, 240, 'AVRUPA');
    landBlock(880, 720, 240, 240, 'ASYA');
    // bridge arc crumbling after 29.6
    const fall = clamp((t - 29.6) / .8);
    ctx.save(); ctx.globalAlpha *= 1 - fall;
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.moveTo(200, 800); ctx.quadraticCurveTo(540, 520 + fall * 300, 880, 800); ctx.stroke();
    ctx.lineWidth = 4; for (let i = 1; i < 12; i++) { const x = 200 + i * 56.7; const yTop = 800 - Math.sin(i / 12 * Math.PI) * 140 + fall * 200; ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, 800 + fall * 300); ctx.stroke(); }
    ctx.restore();
    if (t > 30.0) {
      const fp = clamp((t - 30.0) / 1.6);
      ferry(lerp(-80, 1160, fp), 1050, 1.5, t);
      if (t > 30.8) { font(900, 70); ctx.fillStyle = '#ffd166'; ctx.textAlign = 'center'; ctx.lineWidth = 12; ctx.strokeStyle = '#000a'; const tx = lerp(-80, 1160, fp); ctx.strokeText('DAAAT!', tx, 930); ctx.fillText('DAAAT!', tx, 930); }
    }
    ctx.restore();
    title([['KÖPRÜ DEĞİL...', 70, '#fff'], ['FERİBOT', 84, '#ffd166']], 28.0, 31.5, t, 360);
  }

  // ---- scale (persistent HUD) ----
  let tilt = 0;
  const kf = [[5, 0], [10.4, 0], [11.2, .14], [15.0, .14], [15.6, .26], [18.6, .26], [19.4, .08], [23.2, .08], [24.0, -.1], [29.8, -.1], [30.6, -.24], [32.4, -.24], [33.0, -.5]];
  for (let i = 0; i < kf.length - 1; i++) if (t >= kf[i][0] && t <= kf[i + 1][0]) tilt = lerp(kf[i][1], kf[i + 1][1], backOut(prog(t, kf[i][0], kf[i + 1][0])));
  if (t > kf[kf.length - 1][0]) tilt = -.5;
  if (t > 4.9 && t < 31.6) {
    const drop = easeOut(clamp((t - 4.9) / .6));
    scale(880, lerp(380, 600, drop), .7, tilt, vis(t, 4.9, 31.6, .3, .2));
  }

  // ---- 8: verdict ----
  if (t > 31.5 && t < 35.2) {
    const v = vis(t, 31.6, 35.1, .3, .2);
    ctx.save(); ctx.globalAlpha = v * .55; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();
    scale(W / 2, 760, 1.6, tilt, v);
    title([['SONUÇ:', 70, '#fff'], ['KAYBETTİK', 110, '#e63946']], 32.3, 35.1, t, 380);
    if (t > 33.6) {
      const fv = vis(t, 33.6, 35.1, .25, .2);
      ctx.save(); ctx.globalAlpha = fv;
      cookedFish(W / 2, 1180, 1.0, 0, true); steam(W / 2, 1140, t, 3, 70, .8);
      ctx.restore();
      pill("AMA URFA'DA BALIK BEDAVA", W / 2, 1290, { size: 40, bg: '#06d6a0', fg: '#062', alpha: fv });
    }
  }

  // ---- 9: Ankara + next episode ----
  if (t > 35.0) {
    const v = vis(t, 35.1, 99, .3, .3);
    cityDot('Ankara', CITY.ankara, v);
    const [ax, ay] = P(...CITY.ankara);
    const walk = clamp((t - 35.4) / 3);
    ctx.save(); ctx.globalAlpha = v;
    const px = ax + 60 + walk * 260, py = ay + 170 + Math.abs(Math.sin(t * 8)) * -8;
    umbrella(px + 50, py - 30, .55, false);
    person(px, py, .9, { shirt: '#264653' });
    ctx.fillStyle = '#ff006e'; rr(px - 40, py - 5, 26, 60, 6); ctx.fill(); // towel
    font(800, 30); ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText('nereye?', px, py - 110);
    ctx.restore();
    if (t > 37.9) {
      const cv = clamp((t - 38.0) / .4);
      ctx.save(); ctx.globalAlpha = cv * .8; ctx.fillStyle = '#06121c'; ctx.fillRect(0, 0, W, H); ctx.restore();
      title([['BÖLÜM 3', 120, '#ffd166'], ['ŞEHİRLER NE YAPTI?', 62, '#fff']], 38.0, 99, t, 760);
      ctx.save(); ctx.globalAlpha = cv; font(800, 44); ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText('Kaçırmamak için takip et', W / 2, 1010);
      const bob = Math.sin(t * 6) * 12;
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.moveTo(W / 2 - 45, 1060 + bob); ctx.lineTo(W / 2 + 45, 1060 + bob); ctx.lineTo(W / 2, 1125 + bob); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  subtitles(t);
  badge();
  if (t < .3) { ctx.fillStyle = `rgba(0,0,0,${1 - t / .3})`; ctx.fillRect(0, 0, W, H); }
}

function subtitles(t) {
  for (const [a, b, txt, ss, sl] of SUBS) {
    const v = vis(t, a, b, .25, .25); if (v <= 0) continue;
    ctx.save(); ctx.globalAlpha = v; font(800, 46);
    const lines = wrap(txt, 800), lh = 60, h = lines.length * lh + 36, cx = 515, y0 = 1330;
    rr(cx - 430, y0, 860, h, 24); ctx.fillStyle = '#000000a8'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // reveal words progressively
    const total = txt.split(' ').length; const shown = Math.ceil(total * clamp((t - ss + .15) / sl));
    let count = 0;
    lines.forEach((l, i) => {
      const ws = l.split(' '); const lineW = ctx.measureText(l).width; let x = cx - lineW / 2;
      ctx.textAlign = 'left';
      ws.forEach(w => { count++; ctx.fillStyle = count <= shown ? '#ffffff' : '#ffffff40'; ctx.fillText(w, x, y0 + 18 + lh / 2 + i * lh); x += ctx.measureText(w + ' ').width; });
    });
    ctx.restore();
  }
}


window.renderAt = t => render(t);
window.ready = document.fonts.load('900 40px Inter').then(() => document.fonts.load('800 40px Inter')).then(() => { render(0); return true; });

// ---------- preview controls ----------
if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
const seek = document.getElementById('seek'), tm = document.getElementById('tm'), btn = document.getElementById('play');
let playing = false, start = 0, t0 = 0;
function loop(now) {
  if (!playing) return;
  const t = t0 + (now - start) / 1000;
  if (t >= DUR) { playing = false; btn.textContent = '▶ Oynat'; return; }
  render(t); seek.value = t; tm.textContent = t.toFixed(1) + 's';
  requestAnimationFrame(loop);
}
btn.onclick = () => {
  playing = !playing; btn.textContent = playing ? '❚❚ Durdur' : '▶ Oynat';
  if (playing) { t0 = +seek.value >= DUR - .1 ? 0 : +seek.value; start = performance.now(); requestAnimationFrame(loop); }
};
seek.oninput = () => { playing = false; btn.textContent = '▶ Oynat'; render(+seek.value); tm.textContent = (+seek.value).toFixed(1) + 's'; };
</script>
