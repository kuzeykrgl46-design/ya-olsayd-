<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Ya Olsaydı Logo</title>
<style>html,body{margin:0;background:#0b1620}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
const borderWest = [[26.04,40.73],[26.32,41.05],[26.36,41.35],[26.62,41.6],[26.35,41.72],[26.6,41.95],[27.3,42.1],[27.8,41.98],[28.02,41.98]];
const thraceBlack = [[28.3,41.6],[28.75,41.35],[29.1,41.24]];
const thraceMarmara = [[29.02,41.03],[28.6,40.98],[28.0,41.0],[27.5,40.97],[27.2,40.65],[26.75,40.42],[26.4,40.12],[26.18,40.05],[26.22,40.32],[26.65,40.58],[26.3,40.62]];
const anaBlack = [[29.15,41.22],[29.9,41.15],[30.6,41.15],[31.4,41.3],[32.3,41.75],[33.3,42.0],[34.2,41.97],[34.9,42.05],[35.15,42.02],[35.3,41.7],[36.1,41.65],[36.4,41.25],[37.1,41.15],[38.0,40.98],[38.9,41.03],[39.8,41.0],[40.4,40.98],[41.0,41.2]];
const borderEast = [[41.55,41.52],[42.2,41.5],[42.8,41.58],[43.45,41.12],[43.7,40.98],[43.6,40.5],[43.75,40.15],[44.35,40.03],[44.78,39.71],[44.6,39.5],[44.1,39.35],[44.25,38.95],[44.3,38.4],[44.45,38.0],[44.25,37.85],[44.6,37.6],[44.79,37.15]];
const borderSouth = [[44.3,37.05],[43.9,37.25],[43.3,37.32],[42.75,37.35],[42.36,37.11],[41.4,37.07],[40.0,36.83],[38.95,36.7],[38.0,36.84],[37.1,36.65],[36.67,36.83],[36.6,36.45],[36.68,36.23],[36.38,36.0],[36.15,35.82],[35.92,35.9]];
const medCoast = [[35.97,36.2],[35.85,36.45],[36.17,36.6],[36.0,36.92],[35.6,36.6],[35.0,36.65],[34.6,36.78],[34.05,36.35],[33.6,36.15],[32.85,36.03],[32.3,36.25],[31.75,36.6],[31.0,36.85],[30.6,36.85],[30.55,36.45],[30.35,36.25],[29.7,36.15],[29.1,36.6],[28.6,36.75],[28.05,36.6],[27.6,36.75],[27.45,37.05],[27.25,37.35],[27.25,37.95],[26.75,38.2],[26.3,38.25],[26.5,38.45],[26.9,38.45],[26.75,38.75],[26.9,39.1],[26.65,39.3],[26.1,39.45],[26.15,39.95]];
const marmaraS = [[26.38,40.12],[26.7,40.38],[27.3,40.42],[27.8,40.35],[28.4,40.4],[29.0,40.38],[29.9,40.72],[29.4,40.82],[29.05,41.0]];
const thrace=[...borderWest,...thraceBlack,...thraceMarmara];
const anatolia=[...anaBlack,...borderEast,...borderSouth,...medCoast,...marmaraS];
const vanLake=(()=>{const p=[];for(let i=0;i<40;i++){const a=i/40*Math.PI*2;const x=Math.cos(a)*.62,y=Math.sin(a)*.3;const r=-.45;p.push([42.95+x*Math.cos(r)-y*Math.sin(r),38.65+x*Math.sin(r)+y*Math.cos(r)+(a>3.6&&a<5?.12:0)]);}return p;})();
const W=1080,C=W/2, COS=Math.cos(39*Math.PI/180);
const variant=new URLSearchParams(location.search).get('v')||'a';
const ctx=document.getElementById('c').getContext('2d');
const S=variant==='a'?50:52, LON0=35.4, LAT0=39.0, CY=variant==='a'?640:560;
const P=(lo,la)=>[C+(lo-LON0)*COS*S, CY-(la-LAT0)*S];
function path(pts){ctx.beginPath();pts.forEach(([a,b],i)=>{const[x,y]=P(a,b);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();}
function draw(){
  // sea background (full square; Instagram crops to the inner circle)
  const g=ctx.createRadialGradient(C,C*0.9,60,C,C,C*1.1);
  g.addColorStop(0,'#1d6fa5');g.addColorStop(1,'#0a2a44');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,W);
  // subtle waves
  ctx.strokeStyle='#ffffff14';ctx.lineWidth=5;
  for(let r=0;r<14;r++){ctx.beginPath();for(let x=0;x<=W;x+=12){const y=r*80+30+Math.sin(x*.014+r)*9;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();}
  // island glow + foam ring
  ctx.save();ctx.lineJoin='round';
  [thrace,anatolia].forEach(p=>{path(p);ctx.shadowColor='#bfe9ff';ctx.shadowBlur=40;ctx.strokeStyle='#e6f7ff';ctx.lineWidth=16;ctx.stroke();});
  ctx.restore();
  const lg=ctx.createLinearGradient(0,CY-200,0,CY+200);lg.addColorStop(0,'#f6e6b4');lg.addColorStop(1,'#d9bf80');
  [thrace,anatolia].forEach(p=>{path(p);ctx.fillStyle=lg;ctx.fill();ctx.strokeStyle='#9c7f45';ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();});
  path(vanLake);ctx.fillStyle='#1d6fa5';ctx.fill();
  // question mark
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  if(variant==='a'){
    ctx.font='900 400px Inter';ctx.lineJoin='round';
    ctx.lineWidth=36;ctx.strokeStyle='#0a2a44';ctx.strokeText('?',C,350);
    ctx.fillStyle='#ffd166';ctx.shadowColor='#0008';ctx.shadowBlur=30;ctx.fillText('?',C,350);
  } else {
    ctx.font='900 300px Inter';ctx.lineJoin='round';
    ctx.lineWidth=30;ctx.strokeStyle='#0a2a44';ctx.strokeText('?',C+40,CY-20);
    ctx.fillStyle='#ffd166';ctx.fillText('?',C+40,CY-20);
    ctx.font='900 92px Inter';ctx.lineWidth=18;ctx.strokeText('YA OLSAYDI',C,850);ctx.fillStyle='#fff';ctx.fillText('YA OLSAYDI',C,850);
  }
  ctx.restore();
}
window.ready=document.fonts.load('900 100px Inter').then(()=>{draw();return true});
</script></body></html>
